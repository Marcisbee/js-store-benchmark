<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
</head>

<body>
	<div id="app"></div>
	<script type="module">
		const urlSearchParams = new URLSearchParams(window.location.search);
		const params = Object.fromEntries(urlSearchParams.entries());

		try {
			const { default: mount } = await import(`./${params.bench}`);
			const { default: run, validate } = await import(`./${params.run}`);
			const app = document.getElementById("app");
			const startupStart = performance.now();
			let mountTimer;
			try {
				await Promise.race([
					mount(app),
					new Promise((_, reject) => {
						mountTimer = setTimeout(() => reject(new Error("Mount timed out")), 10000);
					}),
				]);
			} finally {
				clearTimeout(mountTimer);
			}
			window.tachometerResultStartup = performance.now() - startupStart;
			// Let passive-effect subscriptions settle before the first interaction.
			await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));

			window.gc();
			const performanceStart = performance.now();
			await run(app);
			window.tachometerResultPerformance = performance.now() - performanceStart;
			validate(app);
			window.gc();
			window.tachometerResultMemory = window.performance.memory.usedJSHeapSize;
		} catch (error) {
			window.tachometerError = error.stack || String(error);
			console.error(error);
		}
	</script>
</body>

</html>
