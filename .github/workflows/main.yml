name: Deploy
permissions:
  id-token: write
  pages: write
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install
      run: npm ci --omit=dev
      env:
        CI: true

    - name: Build
      run: npm run build
      env:
        CI: true

    - name: Upload
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./web/www

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
